<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình đăng nhập</title>
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Container chính bao bọc toàn bộ nội dung */
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
        }

        /* Thanh Navigation (Header) */
        .nav-bar {
            border: 1px solid #999;
            text-align: center;
            padding: 10px;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .nav-bar strong {
            font-weight: bold;
        }

        /* Khung Đăng nhập (Main Box) */
        .login-box {
            border: 1px solid #999;
            max-width: 450px;
            margin: 0 auto 40px auto;
            padding: 30px;
        }

        .login-box h2 {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 30px;
            color: #333;
        }

        /* Các dòng input */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 100px;
            font-size: 14px;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #0056b3;
        }

        /* Dòng Checkbox */
        .checkbox-group {
            margin-left: 100px; /* Căn thẳng hàng với ô input */
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Khu vực Nút bấm và Quên mật khẩu */
        .actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .actions a {
            text-decoration: none;
            color: #007bff;
            font-size: 14px;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .actions button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .actions button:hover {
            background-color: #004494;
        }

        /* Footer */
        .footer {
            border: 1px solid #999;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Thanh Navigation -->
        <div class="nav-bar">
            Home | <strong>Đăng nhập</strong> | Đăng ký
        </div>

        <!-- Khung Đăng nhập -->
        <div class="login-box">
            <h2>Màn hình đăng nhập</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password">
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="width: auto;">Ghi nhớ đăng nhập</label>
                </div>
                
                <div class="actions">
                    <a href="#">Quên mật khẩu</a>
                    <button type="submit">Đăng nhập</button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="footer">
            Lập trình web @01/2024
        </div>
    </div>

</body>
</html>
