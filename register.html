<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình đăng ký</title>
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Container chính */
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
        }

        /* Thanh Navigation */
        .nav-bar {
            border: 1px solid #999;
            text-align: center;
            padding: 10px;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .nav-bar strong {
            font-weight: bold;
        }

        /* Khung Form (Dùng chung style với khung đăng nhập) */
        .form-box {
            border: 1px solid #999;
            max-width: 450px;
            margin: 0 auto 40px auto;
            padding: 30px;
        }

        .form-box h2 {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 30px;
            color: #333;
        }

        /* Các dòng input */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 100px; /* Độ rộng cố định để các input thẳng hàng */
            font-size: 14px;
            color: #333;
            line-height: 1.4; /* Tạo khoảng cách dòng cho text bị xuống hàng */
        }

        .form-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0056b3;
        }

        /* Khu vực Nút bấm */
        .actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .actions a {
            text-decoration: none;
            color: #007bff;
            font-size: 14px;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .actions button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .actions button:hover {
            background-color: #004494;
        }

        /* Footer */
        .footer {
            border: 1px solid #999;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Thanh Navigation -->
        <div class="nav-bar">
           <a href="login.html">Home</a> |<a href="login.html">Đăng nhập</a> | <strong>Đăng ký</strong>
        </div>

        <!-- Khung Đăng ký -->
        <div class="form-box">
            <h2>Màn hình đăng ký</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <!-- Thẻ <br> giúp chữ xuống dòng giống hệt thiết kế -->
                <div class="form-group">
                    <label for="re-password">Nhập lại<br>mật khẩu</label> 
                    <input type="password" id="re-password" name="re-password" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="actions">
                    <a href="login.html">Đã có tài khoản</a>
                    <button type="submit">Đăng ký</button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="footer">
            Lập trình web @01/2024
        </div>
    </div>

</body>
</html>
